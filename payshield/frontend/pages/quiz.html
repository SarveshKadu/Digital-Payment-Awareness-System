<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Arena — PayShield</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="quiz">

<div id="navbar-root"></div>

<section class="section container">
  <div class="section-head">
    <div class="eyebrow">GAMIFIED QUIZ</div>
    <h2>Quiz Arena</h2>
    <p>15 questions. Beat the clock, track your score, and find out your safety level.</p>
  </div>

  <div class="card" style="max-width:680px;" id="quizCard">
    <div id="quizIntro">
      <p>You'll have 30 seconds per question. Ready?</p>
      <button class="btn btn-primary" id="quizStartBtn">Start Quiz</button>
    </div>
    <div id="quizPlay" style="display:none;"></div>
    <div id="quizResultView" style="display:none;"></div>
  </div>
</section>

<div id="footer-root"></div>

<script src="../js/localData.js"></script>
<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../components/components.js"></script>
<script src="../js/quiz.js"></script>
<script>PayShieldComponents.mount('quiz');</script>
</body>
</html>
